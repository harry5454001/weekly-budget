</style></head><body><main><header><h1>每週花費 <span class="version">V2.2</span></h1><button id="todayBtn">回到本週</button></header><section class="card hero"><div class="nav"><button id="prev" aria-label="上一週">‹</button><div style="text-align:center"><b id="weekTitle"></b><div class="muted" id="weekRange"></div></div><button id="next" aria-label="下一週">›</button></div><div class="muted">本週日常生活費還能花</div><div class="big" id="remaining">$3,100</div><div class="track"><div class="bar" id="bar"></div></div><div class="stats"><div><div class="muted">本週預算</div><b id="budgetText"></b></div><div><div class="muted">已花費</div><b id="spent"></b></div></div><div class="hint" id="daily"></div></section>
<section class="card"><h2>每月預算總覽</h2><label for="monthView">選擇月份</label><input id="monthView" type="month"><div id="monthSummary"></div><p class="foot">日常生活費月參考值為每週預設預算 × 52 ÷ 12；實際仍以每週預算為準。</p></section><section class="card"><h2 id="formTitle">快速記一筆</h2><form id="entryForm"><label for="amount">金額（NT$）</label><input class="amount" id="amount" type="number" inputmode="numeric" min="1" max="99999999" step="1" placeholder="0" required><label>消費分類</label><div class="chips" id="chips"></div><p class="foot" id="bucketHint"></p><div class="grid"><div><label for="date">日期</label><input id="date" type="date" required></div><div><label for="note">備註（選填）</label><input id="note" maxlength="120" placeholder="例如：便當"></div></div><button class="primary" id="submitBtn" type="submit">記帳</button><button class="hidden" type="button" id="cancelEdit" style="width:100%;margin-top:8px">取消編輯</button></form><div id="status" class="status" aria-live="polite"></div></section>
<section class="card"><div class="row"><h2 style="margin:0">本週所有消費</h2><small id="count"></small></div><div id="entries"></div></section>
<section class="card"><h2>本週分類統計（含非每週預算）</h2><div id="categories"></div></section>
<section class="card"><h2>預算設定</h2><form id="budgetForm"><label for="budgetInput">目前所選週預算</label><div class="row"><input id="budgetInput" type="number" inputmode="numeric" min="0" max="99999999" step="1" required><button type="submit">儲存</button></div><label for="defaultInput">未來新週預設預算</label><div class="row"><input id="defaultInput" type="number" inputmode="numeric" min="0" max="99999999" step="1" required><button type="button" id="saveDefault">儲存</button></div></form><form id="monthBudgetForm"><label for="needInput">所選月份必要生活支出預算</label><input id="needInput" type="number" min="0" max="99999999" step="1" required><label for="extraInput">所選月份額外支出預算</label><input id="extraInput" type="number" min="0" max="99999999" step="1" required><button class="primary" type="submit">儲存月預算</button></form><form id="catForm"><label for="catName">新增自訂分類</label><input id="catName" maxlength="24" placeholder="例如：生日禮物" required><label for="catBucket">扣除哪一類預算</label><select id="catBucket"><option value="weekly">每週生活費</option><option value="need">每月必要支出</option><option value="extra">每月額外支出</option><option value="fixed">固定支出（只統計）</option></select><button class="primary" type="submit">新增分類</button></form><p class="foot">週一開始、週日結束，不結轉。必要及額外支出按日曆月計算。固定支出只統計，不扣上述預算。</p><div class="tools"><button id="backup">備份 JSON</button><button id="csv">匯出 CSV</button><button id="restore">還原備份</button><input type="file" id="file" accept=".json,application/json" hidden></div></section><p class="foot">資料儲存在目前裝置與瀏覽器，沒有帳號或伺服器同步。清除網站資料、換裝置或使用私密瀏覽可能遺失紀錄，請定期下載 JSON 備份。</p></main>
<script>
'use strict';const $=id=>document.getElementById(id), KEY='weekly-spending-v1', groups={weekly:'每週生活費',need:'每月必要支出',extra:'每月額外支出',fixed:'固定支出（只統計）'}, base={weekly:['早餐','午餐','晚餐','飲料','電影','交通','聚餐','娛樂','其他'],need:['日用品','洗衣烘衣','訂閱服務','其他必要支出'],extra:['送禮','衣服','鞋子','購物','其他額外支出'],fixed:['房租','保險','健身月費','電信','債務還款','既有分期','其他固定支出']};const fresh=()=>({version:2,defaultBudget:3100,budgets:{},entries:[],monthBudgets:{},custom:[]});let data=fresh(),storageOK=true,loadFailed=false;try{const raw=localStorage.getItem(KEY);if(raw)data=validate(JSON.parse(raw));}catch(e){storageOK=false;loadFailed=true;}let view=monday(today()),month=today().slice(0,7),category='午餐',editing=null;
function allCats(d=data){return Object.entries(base).flatMap(([bucket,names])=>names.map(name=>({name,bucket}))).concat(d.custom||[])}function bucket(c){return allCats().find(x=>x.name===c)?.bucket||'weekly'}function monthLimit(m){return data.monthBudgets[m]||{need:1900,extra:979}}function validMonth(m){return typeof m==='string'&&/^\d{4}-(0[1-9]|1[0-2])$/.test(m)}
function today(){return fmt(new Date())}function fmt(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function parse(s){return new Date(s+'T12:00:00')}function shift(s,n){let d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}function monday(s){let d=parse(s);return shift(s,-((d.getDay()+6)%7))}function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(parse(s))&&fmt(parse(s))===s}function money(n){return (n<0?'−':'')+'$'+Math.abs(n).toLocaleString('zh-TW')}function validMoney(n,min=0){return Number.isSafeInteger(n)&&n>=min&&n<=99999999}function validate(o){if(!o||![1,2].includes(o.version)||!validMoney(o.defaultBudget)||!o.budgets||typeof o.budgets!=='object'||Array.isArray(o.budgets)||!Array.isArray(o.entries))throw Error('invalid');let b={},mb={},custom=[],names=new Set(Object.values(base).flat());for(const [k,v] of Object.entries(o.budgets)){if(!validDate(k)||monday(k)!==k||!validMoney(v))throw Error('invalid');b[k]=v}if(o.version===2){if(!Array.isArray(o.custom)||!o.monthBudgets||typeof o.monthBudgets!=='object'||Array.isArray(o.monthBudgets))throw Error('invalid');for(const c of o.custom){if(!c||typeof c.name!=='string'||!c.name.trim()||c.name.length>24||names.has(c.name)||!Object.hasOwn(groups,c.bucket))throw Error('invalid');names.add(c.name);custom.push({name:c.name,bucket:c.bucket})}for(const [m,v] of Object.entries(o.monthBudgets)){if(!validMonth(m)||!v||!validMoney(v.need)||!validMoney(v.extra))throw Error('invalid');mb[m]={need:v.need,extra:v.extra}}}let ids=new Set();let entries=o.entries.map(e=>{if(!e||typeof e.id!=='string'||ids.has(e.id)||!validDate(e.date)||!names.has(e.category)||!validMoney(e.amount,1)||typeof e.note!=='string'||e.note.length>120)throw Error('invalid');ids.add(e.id);return {id:e.id,date:e.date,category:e.category,amount:e.amount,note:e.note}});return {version:2,defaultBudget:o.defaultBudget,budgets:b,entries,monthBudgets:mb,custom}}function save(){if(loadFailed)return false;try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true;return true}catch(e){storageOK=false;return false}}function say(s){$('status').textContent=s+(storageOK?'':'（目前無法儲存到裝置，請立即備份）')}function ensure(w){if(!(w in data.budgets)){data.budgets[w]=data.defaultBudget;save()}}function budget(w){return data.budgets[w]??data.defaultBudget}function mk(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}function selectCat(c){category=c;for(const el of $('chips').querySelectorAll('button')){el.classList.toggle('active',el.textContent===c);el.setAttribute('aria-pressed',String(el.textContent===c))}$('bucketHint').textContent='記入：'+groups[bucket(c)]}function buildChips(){$('chips').replaceChildren();for(const [g,label] of Object.entries(groups)){$('chips').append(mk('div',label,'groupLabel'));for(const c of allCats().filter(x=>x.bucket===g)){let b=mk('button',c.name,'chip');b.type='button';b.onclick=()=>selectCat(c.name);$('chips').append(b)}}selectCat(category)}function renderMonth(){let r=data.entries.filter(e=>e.date.slice(0,7)===month), limits=monthLimit(month), sums={weekly:0,need:0,extra:0,fixed:0};for(const e of r)sums[bucket(e.category)]+=e.amount;let host=$('monthSummary');host.replaceChildren();for(const [g,label] of Object.entries(groups)){let limit=g==='weekly'?Math.round(data.defaultBudget*52/12):limits[g],section=mk('div',undefined,'budgetrow'),row=mk('div',undefined,'row');row.append(mk('span',label),mk('b',money(sums[g])));section.append(row);if(g!=='fixed'){let rem=limit-sums[g], track=mk('div',undefined,'mini'),bar=mk('div');bar.style.width=(limit?Math.min(100,sums[g]/limit*100):sums[g]?100:0)+'%';if(rem<0)bar.style.background='#c76b65';track.append(bar);section.append(track,mk('small',(g==='weekly'?'月參考額 ':'預算 ')+money(limit)+' · '+(rem<0?'超出 '+money(-rem):'剩餘 '+money(rem)),rem<0?'negative':''))}if(g==='need'||g==='extra'){for(const c of allCats().filter(x=>x.bucket===g)){let amount=r.filter(e=>e.category===c.name).reduce((a,e)=>a+e.amount,0);if(amount){let line=mk('div',undefined,'row');line.style.marginTop='6px';line.append(mk('small',c.name),mk('small',money(amount)));section.append(line)}}}host.append(section)}let line=mk('div',undefined,'budgetrow');line.append(mk('small','本月所有已記支出'),mk('div',money(Object.values(sums).reduce((a,b)=>a+b,0)),'amount'));host.append(line);$('monthView').value=month;$('needInput').value=limits.need;$('extraInput').value=limits.extra}
function render(){let end=shift(view,6), rows=data.entries.filter(e=>e.date>=view&&e.date<=end).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)), total=rows.filter(e=>bucket(e.category)==='weekly').reduce((s,e)=>s+e.amount,0), limit=budget(view), rem=limit-total, current=monday(today());$('weekTitle').textContent=view===current?'本週':view<current?'歷史週':'未來週';$('weekRange').textContent=view.replaceAll('-','/')+' – '+end.slice(5).replace('-','/');$('remaining').textContent=money(rem);$('remaining').classList.toggle('danger',rem<0);$('bar').style.width=(limit?Math.min(100,total/limit*100):total?100:0)+'%';$('bar').style.background=rem<0?'#ffb7a5':'#a7dcb4';$('budgetText').textContent=money(limit);$('spent').textContent=money(total);let days=0;if(view===current){for(let d=today();d<=end;d=shift(d,1))days++}else if(view>current)days=7;$('daily').textContent=rem<0?'已超支 '+money(-rem):days?'剩餘 '+days+' 天（含今天）・平均每日可花 '+money(Math.floor(rem/days)):'本週已結束・剩餘 '+money(rem);$('budgetInput').value=limit;$('defaultInput').value=data.defaultBudget;$('count').textContent=rows.length+' 筆';$('entries').replaceChildren();if(!rows.length)$('entries').append(mk('div','尚未記帳','empty'));for(const e of rows){let r=mk('div',undefined,'entry'), detail=mk('div'), title=mk('div',e.category), sub=mk('small',e.date.slice(5).replace('-','/')+(e.note?' · '+e.note:'')+' · '+groups[bucket(e.category)]), buttons=mk('div');detail.append(title,sub);let edit=mk('button','編輯'),del=mk('button','刪除','del');edit.onclick=()=>startEdit(e);del.onclick=()=>{if(confirm('刪除這筆消費？')){data.entries=data.entries.filter(x=>x.id!==e.id);save();if(editing===e.id)resetForm();render();say('已刪除')}};buttons.append(edit,document.createTextNode(' '),del);r.append(detail,mk('strong',money(e.amount)),buttons);$('entries').append(r)}$('categories').replaceChildren();for(const {name:c} of allCats()){let sum=rows.filter(e=>e.category===c).reduce((s,e)=>s+e.amount,0);if(sum){let r=mk('div',undefined,'row');r.style.padding='6px 0';r.append(mk('span',c),mk('b',money(sum)));$('categories').append(r)}}if(!rows.length)$('categories').append(mk('div','尚無消費資料','empty'));renderMonth()}
function resetForm(){editing=null;$('amount').value='';$('note').value='';$('date').value=view===monday(today())?today():view;$('formTitle').textContent='快速記一筆';$('submitBtn').textContent='記帳';$('cancelEdit').classList.add('hidden');selectCat('午餐')}function startEdit(e){editing=e.id;$('amount').value=e.amount;$('note').value=e.note;$('date').value=e.date;selectCat(e.category);$('formTitle').textContent='編輯消費';$('submitBtn').textContent='儲存修改';$('cancelEdit').classList.remove('hidden');$('formTitle').scrollIntoView({block:'center',behavior:'smooth'})}function go(w){view=w;month=(w===monday(today())?today():w).slice(0,7);resetForm();render();say('')}
$('prev').onclick=()=>go(shift(view,-7));$('next').onclick=()=>go(shift(view,7));$('todayBtn').onclick=()=>go(monday(today()));$('cancelEdit').onclick=resetForm;$('entryForm').onsubmit=ev=>{ev.preventDefault();let amount=Number($('amount').value),date=$('date').value;if(!validMoney(amount,1)||!validDate(date)){say('請輸入有效金額與日期');return}let entry={id:editing||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),amount,date,category,note:$('note').value.trim()};if(editing)data.entries=data.entries.map(x=>x.id===editing?entry:x);else data.entries.push(entry);view=monday(date);month=date.slice(0,7);ensure(view);save();resetForm();render();say('已儲存 '+money(amount))};$('budgetForm').onsubmit=ev=>{ev.preventDefault();let n=Number($('budgetInput').value);if(validMoney(n)) {data.budgets[view]=n;save();render();say('本週預算已更新')}};$('saveDefault').onclick=()=>{let n=Number($('defaultInput').value);if(validMoney(n)&&$('defaultInput').value!==''){ensure(view);data.defaultBudget=n;save();render();say('未來新週預算已更新')}};
$('monthView').onchange=()=>{if(validMonth($('monthView').value)){month=$('monthView').value;renderMonth()}};$('monthBudgetForm').onsubmit=e=>{e.preventDefault();let need=Number($('needInput').value),extra=Number($('extraInput').value);if(validMoney(need)&&validMoney(extra)){data.monthBudgets[month]={need,extra};save();renderMonth();say('月預算已更新')}};$('catForm').onsubmit=e=>{e.preventDefault();let name=$('catName').value.trim(),g=$('catBucket').value;if(!name||name.length>24||allCats().some(x=>x.name===name)||!Object.hasOwn(groups,g)){say('分類名稱無效或已存在');return}data.custom.push({name,bucket:g});save();$('catName').value='';buildChips();render();say('已新增分類')};
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('backup').onclick=()=>download('weekly-budget-'+today()+'.json',JSON.stringify(data,null,2),'application/json');function esc(s){s=String(s);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}$('csv').onclick=()=>download('expenses-'+today()+'.csv','\ufeff'+[['日期','分類','金額','備註','預算類別'],...data.entries.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date,e.category,e.amount,e.note,groups[bucket(e.category)]])].map(row=>row.map(esc).join(',')).join('\r\n'),'text/csv;charset=utf-8');$('restore').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{const imported=validate(JSON.parse(await f.text()));if(confirm('還原將取代目前所有紀錄及預算，確定嗎？')){data=imported;loadFailed=false;save();buildChips();go(monday(today()));say('備份已還原')}}catch(e){say('無法讀取備份，請選擇本工具匯出的 JSON 檔')}finally{$('file').value=''}};buildChips();ensure(view);resetForm();render();if(!storageOK)say('儲存功能未啟用');let lastCurrent=monday(today());document.addEventListener('visibilitychange',()=>{if(!document.hidden){let now=monday(today());if(view===lastCurrent&&now!==lastCurrent)go(now);else render();lastCurrent=now}});
</script></body></html>
