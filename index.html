<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f4ef"><meta name="apple-mobile-web-app-capable" content="yes"><title>每週花費</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#24332e;background:#f5f4ef;font-size:16px;--muted:#63716b;--green:#246b55}*{box-sizing:border-box}body{margin:0}main{max-width:480px;margin:auto;padding:24px 16px calc(30px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}h1{font-size:24px;margin:0;letter-spacing:.04em}h2{font-size:17px;margin:0 0 14px}small,.muted{color:var(--muted);font-size:13px}.card{background:white;border:1px solid #e6e6df;border-radius:20px;padding:20px;margin-bottom:14px}.hero{background:#173e34;color:#fff;border:0}.hero .muted{color:#c9dfd5}.nav,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.nav{margin:0 0 22px}.hero button{background:#ffffff1c;color:white;border:1px solid #ffffff35}.big{font-size:48px;font-weight:750;letter-spacing:-2px;line-height:1.25;margin:5px 0 16px;font-variant-numeric:tabular-nums}.track{background:#ffffff26;height:9px;border-radius:99px;overflow:hidden;margin:0 0 12px}.bar{height:100%;background:#a7dcb4;border-radius:99px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.stats b{display:block;font-size:21px;margin-top:4px}.hint{font-size:14px;border-top:1px solid #ffffff26;padding-top:12px;margin-top:16px}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:10px 13px;background:#edf0e9;color:#24332e;cursor:pointer;min-height:42px}button:active{opacity:.75}button.primary{background:var(--green);color:#fff;width:100%;font-weight:650;margin-top:14px;min-height:50px}input,select{width:100%;border:1px solid #dce2dc;border-radius:11px;background:#fff;padding:12px;color:inherit;min-height:46px}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}.amount{font-size:28px;font-weight:650}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.chip{font-size:14px;padding:9px 12px;min-height:38px}.chip.active{background:#d9ebdf;color:#14563e;outline:1px solid #8ab6a0}.entry{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #ebeee9}.entry:last-child{border:0}.entry strong{font-variant-numeric:tabular-nums}.entry button{min-height:34px;padding:5px 9px;font-size:13px}.entry .del{background:#f8eeee;color:#a13e36}.entry small{display:block;margin-top:3px;overflow-wrap:anywhere}.empty{text-align:center;padding:22px 0;color:var(--muted)}.danger{color:#ffb7a5}.tools{display:flex;flex-wrap:wrap;gap:8px}.tools button{font-size:13px}.foot{font-size:12px;color:var(--muted);line-height:1.7}.status{font-size:13px;margin-top:10px;color:var(--green);min-height:18px}.settings{margin-top:12px}.hidden{display:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #79ad91;outline-offset:2px}
</style></head><body><main><header><h1>每週花費</h1><button id="todayBtn">回到本週</button></header><section class="card hero"><div class="nav"><button id="prev" aria-label="上一週">‹</button><div style="text-align:center"><b id="weekTitle"></b><div class="muted" id="weekRange"></div></div><button id="next" aria-label="下一週">›</button></div><div class="muted">本週還能花</div><div class="big" id="remaining">$3,100</div><div class="track"><div class="bar" id="bar"></div></div><div class="stats"><div><div class="muted">本週預算</div><b id="budgetText"></b></div><div><div class="muted">已花費</div><b id="spent"></b></div></div><div class="hint" id="daily"></div></section>
<section class="card"><h2 id="formTitle">快速記一筆</h2><form id="entryForm"><label for="amount">金額（NT$）</label><input class="amount" id="amount" type="number" inputmode="numeric" min="1" max="99999999" step="1" placeholder="0" required><label>消費分類</label><div class="chips" id="chips"></div><div class="grid"><div><label for="date">日期</label><input id="date" type="date" required></div><div><label for="note">備註（選填）</label><input id="note" maxlength="120" placeholder="例如：便當"></div></div><button class="primary" id="submitBtn" type="submit">記帳</button><button class="hidden" type="button" id="cancelEdit" style="width:100%;margin-top:8px">取消編輯</button></form><div id="status" class="status" aria-live="polite"></div></section>
<section class="card"><div class="row"><h2 style="margin:0">本週消費</h2><small id="count"></small></div><div id="entries"></div></section>
<section class="card"><h2>本週分類統計</h2><div id="categories"></div></section>
<section class="card"><h2>預算設定</h2><form id="budgetForm"><label for="budgetInput">目前所選週預算</label><div class="row"><input id="budgetInput" type="number" inputmode="numeric" min="0" max="99999999" step="1" required><button type="submit">儲存</button></div><label for="defaultInput">未來新週預設預算</label><div class="row"><input id="defaultInput" type="number" inputmode="numeric" min="0" max="99999999" step="1" required><button type="button" id="saveDefault">儲存</button></div></form><p class="foot">週一開始、週日結束。每週獨立計算，不結轉。房租、分期等固定支出請另行管理。</p><div class="tools"><button id="backup">備份 JSON</button><button id="csv">匯出 CSV</button><button id="restore">還原備份</button><input type="file" id="file" accept=".json,application/json" hidden></div></section><p class="foot">資料儲存在目前裝置與瀏覽器，沒有帳號或伺服器同步。清除網站資料、換裝置或使用私密瀏覽可能遺失紀錄，請定期下載 JSON 備份。</p></main>
<script>
'use strict';const $=id=>document.getElementById(id), KEY='weekly-spending-v1', cats=['早餐','午餐','晚餐','飲料','電影','交通','日用品','其他'];const fresh=()=>({version:1,defaultBudget:3100,budgets:{},entries:[]});let data=fresh(), storageOK=true;try{const raw=localStorage.getItem(KEY);if(raw)data=validate(JSON.parse(raw));}catch(e){storageOK=false;}let view=monday(today()), category='午餐', editing=null;
function today(){return fmt(new Date())}function fmt(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function parse(s){return new Date(s+'T12:00:00')}function shift(s,n){let d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}function monday(s){let d=parse(s);return shift(s,-((d.getDay()+6)%7))}function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(parse(s))&&fmt(parse(s))===s}function money(n){return (n<0?'−':'')+'$'+Math.abs(n).toLocaleString('zh-TW')}function validMoney(n,min=0){return Number.isSafeInteger(n)&&n>=min&&n<=99999999}function validate(o){if(!o||o.version!==1||!validMoney(o.defaultBudget)||!o.budgets||typeof o.budgets!=='object'||Array.isArray(o.budgets)||!Array.isArray(o.entries))throw Error('invalid');let b={};for(const [k,v] of Object.entries(o.budgets)){if(!validDate(k)||monday(k)!==k||!validMoney(v))throw Error('invalid');b[k]=v}let ids=new Set();let entries=o.entries.map(e=>{if(!e||typeof e.id!=='string'||ids.has(e.id)||!validDate(e.date)||!cats.includes(e.category)||!validMoney(e.amount,1)||typeof e.note!=='string'||e.note.length>120)throw Error('invalid');ids.add(e.id);return {id:e.id,date:e.date,category:e.category,amount:e.amount,note:e.note}});return {version:1,defaultBudget:o.defaultBudget,budgets:b,entries}}function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true;return true}catch(e){storageOK=false;return false}}function say(s){$('status').textContent=s+(storageOK?'':'（目前無法儲存到裝置，請立即備份）')}function ensure(w){if(!(w in data.budgets)){data.budgets[w]=data.defaultBudget;save()}}function budget(w){return data.budgets[w]??data.defaultBudget}function mk(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}function selectCat(c){category=c;for(const el of $('chips').children){el.classList.toggle('active',el.textContent===c);el.setAttribute('aria-pressed',String(el.textContent===c))}}for(const c of cats){let b=mk('button',c,'chip');b.type='button';b.onclick=()=>selectCat(c);$('chips').append(b)}
function render(){let end=shift(view,6), rows=data.entries.filter(e=>e.date>=view&&e.date<=end).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)), total=rows.reduce((s,e)=>s+e.amount,0), limit=budget(view), rem=limit-total, current=monday(today());$('weekTitle').textContent=view===current?'本週':view<current?'歷史週':'未來週';$('weekRange').textContent=view.replaceAll('-','/')+' – '+end.slice(5).replace('-','/');$('remaining').textContent=money(rem);$('remaining').classList.toggle('danger',rem<0);$('bar').style.width=(limit?Math.min(100,total/limit*100):total?100:0)+'%';$('bar').style.background=rem<0?'#ffb7a5':'#a7dcb4';$('budgetText').textContent=money(limit);$('spent').textContent=money(total);let days=0;if(view===current){for(let d=today();d<=end;d=shift(d,1))days++}else if(view>current)days=7;$('daily').textContent=rem<0?'已超支 '+money(-rem):days?'剩餘 '+days+' 天（含今天）・平均每日可花 '+money(Math.floor(rem/days)):'本週已結束・剩餘 '+money(rem);$('budgetInput').value=limit;$('defaultInput').value=data.defaultBudget;$('count').textContent=rows.length+' 筆';$('entries').replaceChildren();if(!rows.length)$('entries').append(mk('div','尚未記帳','empty'));for(const e of rows){let r=mk('div',undefined,'entry'), detail=mk('div'), title=mk('div',e.category), sub=mk('small',e.date.slice(5).replace('-','/')+(e.note?' · '+e.note:'')), buttons=mk('div');detail.append(title,sub);let edit=mk('button','編輯'),del=mk('button','刪除','del');edit.onclick=()=>startEdit(e);del.onclick=()=>{if(confirm('刪除這筆消費？')){data.entries=data.entries.filter(x=>x.id!==e.id);save();if(editing===e.id)resetForm();render();say('已刪除')}};buttons.append(edit,document.createTextNode(' '),del);r.append(detail,mk('strong',money(e.amount)),buttons);$('entries').append(r)}$('categories').replaceChildren();for(const c of cats){let sum=rows.filter(e=>e.category===c).reduce((s,e)=>s+e.amount,0);if(sum){let r=mk('div',undefined,'row');r.style.padding='6px 0';r.append(mk('span',c),mk('b',money(sum)));$('categories').append(r)}}if(!total)$('categories').append(mk('div','尚無消費資料','empty'))}
function resetForm(){editing=null;$('amount').value='';$('note').value='';$('date').value=view===monday(today())?today():view;$('formTitle').textContent='快速記一筆';$('submitBtn').textContent='記帳';$('cancelEdit').classList.add('hidden');selectCat('午餐')}function startEdit(e){editing=e.id;$('amount').value=e.amount;$('note').value=e.note;$('date').value=e.date;selectCat(e.category);$('formTitle').textContent='編輯消費';$('submitBtn').textContent='儲存修改';$('cancelEdit').classList.remove('hidden');$('formTitle').scrollIntoView({block:'center',behavior:'smooth'})}function go(w){view=w;resetForm();render();say('')}
$('prev').onclick=()=>go(shift(view,-7));$('next').onclick=()=>go(shift(view,7));$('todayBtn').onclick=()=>go(monday(today()));$('cancelEdit').onclick=resetForm;$('entryForm').onsubmit=ev=>{ev.preventDefault();let amount=Number($('amount').value),date=$('date').value;if(!validMoney(amount,1)||!validDate(date)){say('請輸入有效金額與日期');return}let entry={id:editing||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),amount,date,category,note:$('note').value.trim()};if(editing)data.entries=data.entries.map(x=>x.id===editing?entry:x);else data.entries.push(entry);view=monday(date);ensure(view);save();resetForm();render();say('已儲存 '+money(amount))};$('budgetForm').onsubmit=ev=>{ev.preventDefault();let n=Number($('budgetInput').value);if(validMoney(n)) {data.budgets[view]=n;save();render();say('本週預算已更新')}};$('saveDefault').onclick=()=>{let n=Number($('defaultInput').value);if(validMoney(n)&&$('defaultInput').value!==''){ensure(view);data.defaultBudget=n;save();render();say('未來新週預算已更新')}};
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('backup').onclick=()=>download('weekly-budget-'+today()+'.json',JSON.stringify(data,null,2),'application/json');function esc(s){s=String(s);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}$('csv').onclick=()=>download('expenses-'+today()+'.csv','\ufeff'+[['日期','分類','金額','備註'],...data.entries.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date,e.category,e.amount,e.note])].map(row=>row.map(esc).join(',')).join('\r\n'),'text/csv;charset=utf-8');$('restore').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{const imported=validate(JSON.parse(await f.text()));if(confirm('還原將取代目前所有紀錄及預算，確定嗎？')){data=imported;save();go(monday(today()));say('備份已還原')}}catch(e){say('無法讀取備份，請選擇本工具匯出的 JSON 檔')}finally{$('file').value=''}};ensure(view);resetForm();render();if(!storageOK)say('儲存功能未啟用');document.addEventListener('visibilitychange',()=>{if(!document.hidden){render()}});
</script></body></html>
